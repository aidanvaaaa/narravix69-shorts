name: Voice samples

on:
  workflow_dispatch:

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1
      - name: Python packages
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt
      - name: Record the samples
        run: python -m pipeline.voice_samples
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: out/voices/*.mp3
          retention-days: 7
