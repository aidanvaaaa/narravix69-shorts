name: Emotional voice samples

on:
  workflow_dispatch:

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1
      - name: Reference voices (Kokoro, synthetic)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt
          python -m pipeline.emotion_samples refs
      - name: Chatterbox samples
        run: |
          pip install --quiet chatterbox-tts
          python -m pipeline.emotion_samples make
      - uses: actions/upload-artifact@v4
        with:
          name: emotion-samples
          path: out/emotion/*.mp3
          retention-days: 7
